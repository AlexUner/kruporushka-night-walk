<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d10">
  <meta name="description" content="Ночная фотопрогулка по Озёрску Калининградской области. Четыре кадра, одна дверь и кресло, которое все еще качается.">
  <title>Крупорушка — ночная прогулка по Озёрску</title>
  <link rel="stylesheet" href="walk.css?v=3">
  <script src="locations.js?v=3" defer></script>
  <script src="walk.js?v=3" defer></script>
</head>
<body>
  <main class="walk">
    <header class="masthead">
      <div class="identity">
        <a class="wordmark" href="#street">Крупорушка</a>
        <span class="subtitle">Ночная прогулка</span>
      </div>
      <a class="city" href="map.html" aria-label="Карта прогулки: Озёрск, Калининградская область">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>
        <span>Озёрск<small>Калининградская область</small></span>
      </a>
    </header>

    <section class="viewport" aria-labelledby="scene-title">
      <div class="backdrop" aria-hidden="true"></div>
      <h1 class="sr-only" id="scene-title" aria-live="polite">Улица</h1>
      <div class="stage">
        <div class="shot is-current" data-stop="street">
          <picture>
            <source media="(max-width: 550px), (max-width: 950px) and (max-height: 520px)" srcset="assets/street-small.webp">
            <img src="assets/street.webp" srcset="assets/street-small.webp 528w, assets/street.webp 768w" sizes="min(100vw, 75vh)" decoding="async" alt="Темная улица, брусчатка и несколько освещенных окон." width="768" height="1024" fetchpriority="high">
          </picture>
          <a class="path-arrow path-forward" href="#bridge" aria-label="Идти к мосту">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
        </div>
        <div class="shot" data-stop="bridge" inert>
          <picture>
            <source media="(max-width: 550px), (max-width: 950px) and (max-height: 520px)" srcset="assets/bridge-small.webp">
            <img src="assets/bridge.webp" srcset="assets/bridge-small.webp 528w, assets/bridge.webp 768w" sizes="min(100vw, 75vh)" decoding="async" alt="Перила моста и голые ветки в свете вспышки." width="768" height="1024">
          </picture>
          <a class="path-arrow path-forward" href="#bakery" aria-label="Повернуть налево к пекарне">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
          <a class="path-arrow path-back" href="#street" aria-label="Вернуться на улицу">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
        </div>
        <div class="shot" data-stop="bakery" inert>
          <picture>
            <source media="(max-width: 550px), (max-width: 950px) and (max-height: 520px)" srcset="assets/bakery-small.webp">
            <img src="assets/bakery.webp" srcset="assets/bakery-small.webp 704w, assets/bakery.webp 1024w" sizes="min(100vw, 133vh)" decoding="async" alt="Красная вывеска «ОЗЕРСКИЙ ХЛЕБ» над ночным тротуаром." width="1024" height="768">
          </picture>
          <a class="path-arrow path-forward" href="#door" aria-label="Идти к Крупорушке">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
          <a class="path-arrow path-back" href="#bridge" aria-label="Вернуться к мосту">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
        </div>
        <div class="shot" data-stop="door" inert>
          <picture>
            <source media="(max-width: 550px), (max-width: 950px) and (max-height: 520px)" srcset="assets/door-small.webp">
            <img src="assets/door.webp" srcset="assets/door-small.webp 528w, assets/door.webp 768w" sizes="min(100vw, 75vh)" decoding="async" alt="Дом с эркером и светлой дверью справа." width="768" height="1024">
          </picture>
          <a class="door-outline path-forward" href="#room" aria-label="Открыть дверь">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path class="door-edge" d="M24 11 78 15 87 88 31 91Z"/>
              <path class="door-light" pathLength="1" d="M24 11 78 15 87 88 31 91Z"/>
            </svg>
          </a>
          <a class="path-arrow path-back" href="#bakery" aria-label="Вернуться к пекарне">
            <svg viewBox="0 0 112 62" aria-hidden="true">
              <path class="arrow-trail" d="M46 59H66"/>
              <path d="M46 51V33H26L56 9 86 33H66V51Z"/>
            </svg>
          </a>
        </div>
        <div class="shot" data-stop="room" inert>
          <video id="chair" src="assets/chair.mp4" poster="assets/chair.webp" muted playsinline loop preload="none" aria-label="Пустое рыжее кресло качается среди черных стульев" width="576" height="432"></video>
          <div class="room-controls">
            <a href="#door" aria-label="Выйти на улицу">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg>
            </a>
            <button id="motion-control" type="button" data-playing="false" aria-label="Смотреть">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14m6-14v14"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="scene-fade" aria-hidden="true"></div>
      <aside class="minimap" aria-label="Мини-карта прогулки">
        <a class="minimap-open" href="map.html" aria-label="Открыть карту Озёрска">
          <svg viewBox="0 0 160 180" aria-hidden="true" class="minimap-graphic">
            <image href="assets/ozersk-map.svg" width="160" height="180"/>
            <g class="minimap-grid"><path d="M0 45h160M0 90h160M0 135h160M40 0v180M80 0v180M120 0v180"/></g>
            <g id="minimap-stops"></g>
            <g id="minimap-cursor">
              <circle class="map-halo" r="10"/>
              <circle class="map-pulse" r="8"/>
              <circle class="map-dot" r="4.5"/>
            </g>
          </svg>
          <span class="minimap-compass" aria-hidden="true">С</span>
          <span class="minimap-progress" aria-hidden="true"></span>
        </a>
        <a class="minimap-credit" href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>
      </aside>
    </section>
    <noscript>Включите JavaScript, чтобы пройти по фотографиям и открыть дверь.</noscript>
  </main>
</body>
</html>
